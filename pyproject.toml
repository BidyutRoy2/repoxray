[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoxray"
version = "0.1.0"
description = "X-ray any Python codebase: architecture map, import cycles, dead code, and complexity hotspots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bidyut Roy" }]
keywords = ["architecture", "static-analysis", "codebase", "dead-code", "import-graph", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
repoxray = "repoxray.cli:main"

[project.urls]
Homepage = "https://github.com/BidyutRoy2/repoxray"
Issues = "https://github.com/BidyutRoy2/repoxray/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
